name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: telda-skb/eternal

jobs:
  ci:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, gd, exif, iconv, intl, mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Laravel Pint (code style)
        run: php vendor/bin/pint --test
        continue-on-error: true

      - name: Run PHPUnit tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        continue-on-error: true

  build-image:
    name: Build Docker Image
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_ENV=production
            APP_DEBUG=false

      - name: Save image info
        run: |
          echo "### Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Registry: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Server
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            echo "========================================="
            echo "  DEPLOY STARTED at $(date)"
            echo "========================================="

            cd /opt/docker/eternal

            echo "--- 1/8 Login to GHCR ---"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            echo "--- 2/8 Pull latest code ---"
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo chown -R $(whoami):$(whoami) /opt/docker/eternal

            echo "--- 3/8 Load .env ---"
            set -a
            source .env
            set +a

            echo "--- 4/8 Running backup ---"
            bash deploy/backup.sh || echo "Backup failed, continuing..."

            echo "--- 5/8 Pull new Docker image & restart ---"
            docker compose pull app
            docker compose stop app queue 2>/dev/null || true
            docker compose rm -f app queue 2>/dev/null || true
            docker compose up -d app queue

            echo "--- Waiting for containers to be ready ---"
            sleep 15

            echo "--- 6/8 Running migrations ---"
            docker compose exec -T app php artisan migrate --force

            echo "--- 7/8 Post-deploy setup ---"
            docker compose exec -T app php artisan livewire:publish --assets
            docker compose exec -T app php artisan view:clear
            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache

            echo "--- 8/8 Health check ---"
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082 || echo "000")
            echo "App HTTP status: ${HTTP_STATUS}"

            if [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "302" ]; then
              echo "========================================="
              echo "  DEPLOY SUCCESS!"
              echo "  Time: $(date)"
              echo "========================================="
            else
              echo "========================================="
              echo "  DEPLOY FAILED: HTTP ${HTTP_STATUS}"
              echo "  Attempting rollback..."
              echo "========================================="

              docker compose down app queue
              docker compose up -d app queue
              sleep 10
              ROLLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082 || echo "000")
              echo "Rollback HTTP status: ${ROLLBACK_STATUS}"
              exit 1
            fi

  notify:
    name: Discord Notification
    needs: [build-image, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check webhook URL
        id: check-webhook
        if: always()
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "::warning::DISCORD_WEBHOOK_URL secret is not set! Discord notification will be skipped."
          else
            echo "status=present" >> $GITHUB_OUTPUT
            echo "Discord webhook URL is configured (masked: $(echo '${{ secrets.DISCORD_WEBHOOK_URL }}' | sed 's/\(.\{8\}\).*/\1.../'))"
          fi

      - name: Send Discord notification
        if: steps.check-webhook.outputs.status == 'present'
        run: |
          DEPLOY_RESULT="${{ needs.deploy.result }}"
          BUILD_RESULT="${{ needs.build-image.result }}"

          echo "Deploy result: ${DEPLOY_RESULT}"
          echo "Build result: ${BUILD_RESULT}"

          if [ "$DEPLOY_RESULT" = "success" ]; then
            COLOR=3066993
            TITLE="Deploy SUCCESS"
            DESCRIPTION="Deployment to production completed successfully."
          elif [ "$BUILD_RESULT" = "failure" ]; then
            COLOR=15158332
            TITLE="Deploy FAILED (Build)"
            DESCRIPTION="Docker image build failed."
          else
            COLOR=15158332
            TITLE="Deploy FAILED"
            DESCRIPTION="Deployment to production failed."
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1 | cut -c1-200)
          IMAGE_TAG="${{ needs.build-image.outputs.image_tag }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"

          echo "Sending Discord notification..."
          echo "Title: ${TITLE}"
          echo "Color: ${COLOR}"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESCRIPTION" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg author "$ACTOR" \
            --arg commit "${COMMIT_MSG:-No commit message}" \
            --arg image "ghcr.io/${REPO}:${IMAGE_TAG}" \
            --arg run "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                description: $desc,
                fields: [
                  {name: "Repository", value: $repo, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Author", value: $author, inline: true},
                  {name: "Commit", value: $commit, inline: false},
                  {name: "Image", value: ("`" + $image + "`"), inline: false},
                  {name: "Run", value: ("[View Details](" + $run + ")"), inline: false}
                ],
                footer: {text: "GitHub Actions"},
                timestamp: (now | strftime("%Y-%m-%dT%H:%M:%SZ"))
              }]
            }')

          echo "JSON payload:"
          echo "$PAYLOAD" | jq .

          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | grep -o 'HTTP_CODE:[0-9]*' | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed 's/HTTP_CODE:[0-9]*//')

          echo "Discord API response code: ${HTTP_CODE}"
          echo "Discord API response body: ${BODY}"

          if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "Discord notification sent successfully!"
          else
            echo "::error::Discord notification failed with HTTP ${HTTP_CODE}"
            echo "Response: ${BODY}"
          fi
